name: Build OU Escape Route APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Get the project
      - name: Checkout project
        uses: actions/checkout@v6

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Configure Android SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"

      # 4. Install required Android SDK packages
      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 5. Verify Android installation
      - name: Verify Android SDK
        run: |
          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

          echo "SDK packages:"
          sdkmanager --list_installed

          echo "ADB:"
          adb version

      # 6. Install Gradle 8.1.1
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      # 7. Create Gradle wrapper
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.1.1

      # 8. Make wrapper executable
      - name: Make Gradle Wrapper executable
        run: chmod +x ./gradlew

      # 9. Clean
      - name: Clean project
        run: ./gradlew clean

      # 10. Build APK
      - name: Build OU Escape Route APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 11. Show APK
      - name: Show generated APK
        run: |
          echo "======================================"
          echo "OU ESCAPE ROUTE APK"
          echo "======================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      # 12. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OU-Escape-Route-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
